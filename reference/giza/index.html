<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0b08">
<meta name="description" content="Digital Giza Project Management Simulator - an interactive Three.js digital twin of the Giza Necropolis combining archaeological reconstruction with a full PMBOK-aligned construction project simulation.">
<title>Digital Giza - Project Management Simulator</title>
<link rel="stylesheet" href="./src/ui/styles.css">
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="ui-root"></div>
</div>

<div id="boot">
  <div class="boot-inner">
    <div class="boot-glyph" aria-hidden="true">
      <svg viewBox="0 0 120 84" width="120" height="84">
        <polygon points="60,6 114,78 6,78" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <polygon points="60,6 60,78 6,78" fill="currentColor" opacity="0.14"/>
        <line x1="24" y1="78" x2="60" y2="30" stroke="currentColor" stroke-width="0.75" opacity="0.5"/>
        <line x1="96" y1="78" x2="60" y2="30" stroke="currentColor" stroke-width="0.75" opacity="0.5"/>
      </svg>
    </div>
    <h1 class="boot-title">DIGITAL GIZA</h1>
    <p class="boot-sub">Project Management Simulator</p>
    <div class="boot-bar"><i id="boot-fill"></i></div>
    <p id="boot-step" class="boot-step">Initialising renderer&hellip;</p>
    <p class="boot-foot">Khufu&rsquo;s Horizon &middot; 2560&nbsp;BCE &middot; Giza Plateau, Egypt</p>
  </div>
</div>

<noscript>
  <div class="noscript">This simulator requires JavaScript and a WebGL&nbsp;2 capable browser (Chrome, Edge or Firefox).</div>
</noscript>

<script type="importmap">
{
  "imports": {
    "three": "./assets/vendor/three.module.js"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
